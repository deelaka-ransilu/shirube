<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shirube</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
   <div class="shell">
    <div class="panel">
      <header class="panel-header">
        <nav class="tabs" aria-label="Main">
          <span class="nav-pill" aria-hidden="true"></span>
          <a href="#/found" data-nav="found" title="New jobs"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span class="nav-label">New jobs</span></a>
          <a href="#/jobs" data-nav="jobs" title="Jobs"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/></svg><span class="nav-label">Jobs</span></a>
          <a href="#/" data-nav="dashboard" title="Dashboard"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span class="nav-label">Dashboard</span></a>
          <a href="#/followups" data-nav="followups" title="Follow-ups"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg><span class="nav-label">Follow-ups</span></a>
          <a href="#/profile" data-nav="profile" title="Profile"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="nav-label">Profile</span></a>
        </nav>
        <div class="topbar">
          <div class="top-action" id="top-action"></div>
          <form class="search" id="search" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <label class="sr-only" for="search-input">Search jobs</label>
            <input id="search-input" name="q" type="search" placeholder="Search jobs…" autocomplete="off">
            <kbd class="key-hint" aria-hidden="true">/</kbd>
          </form>
          <div class="bell-wrap">
            <button type="button" class="bell" id="bell" aria-label="Follow-ups" title="Follow-ups" aria-haspopup="dialog" aria-expanded="false" aria-controls="bell-pop">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1112 0v5l2 2H4zM10 21h4"/></svg>
              <span class="bell-count" id="bell-count" aria-hidden="true" hidden></span>
            </button>
            <div class="bell-pop" id="bell-pop" role="dialog" aria-label="Follow-ups due" hidden></div>
          </div>
        </div>
      </header>
      <main class="panel-body" id="page"></main>
    </div>

   </div>
  </div>
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/lib/nav-pill.js"></script>
</body>
</html>
