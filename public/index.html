<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shirube | Local Job Tracker</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/jobs.css">
  <link rel="stylesheet" href="css/found.css">

<body>

      <nav aria-label="Main">

      <details class="avatar-menu">

        <div class="menu">
          <a href="#profile" class="menu-item" data-screen="profile">My profile</a>

          <a href="#backup" class="menu-item" data-screen="backup">Export backup</a>
