<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shirube</title>
  <script>/* theme first, so the page never flashes the wrong colours */
    (function () { var t = null; try { t = localStorage.getItem("shirube-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t); })();
  </script>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
   <div class="shell">
    <div class="panel">
      <header class="panel-header">
        <div class="page-title" id="page-title" aria-hidden="true"></div>
        <div class="topbar">
          <div class="top-action" id="top-action"></div>
          <form class="search" id="search" role="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <label class="sr-only" for="search-input">Search jobs</label>
            <input id="search-input" name="q" type="search" placeholder="Search jobs…" autocomplete="off">
            <kbd class="key-hint" aria-hidden="true">/</kbd>
          </form>
          <div class="bell-wrap">
            <button type="button" class="bell" id="bell" aria-label="Follow-ups" title="Follow-ups" aria-haspopup="dialog" aria-expanded="false" aria-controls="bell-pop">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1112 0v5l2 2H4zM10 21h4"/></svg>
              <span class="bell-count" id="bell-count" aria-hidden="true" hidden></span>
            </button>
            <div class="bell-pop" id="bell-pop" role="dialog" aria-label="Follow-ups due" hidden></div>
          </div>
          <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
          </button>
        </div>
      </header>
      <main class="panel-body" id="page"></main>
    </div>

    <nav class="dock" aria-label="Main">
      <a href="#/found" data-nav="found" aria-label="New jobs" title="New jobs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </a>
      <a href="#/jobs" data-nav="jobs" aria-label="Jobs" title="Jobs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/></svg>
      </a>
      <a href="#/" data-nav="dashboard" aria-label="Dashboard" title="Dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>
      </a>
      <a href="#/followups" data-nav="followups" aria-label="Follow-ups" title="Follow-ups">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </a>
      <a href="#/profile" data-nav="profile" aria-label="My profile" title="My profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
    </nav>
   </div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
